<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Тестовая страница сайта albionai.lol">
  <title>Albion AI — тестовая страница</title>
  <style>
    :root { color-scheme: light dark; --bg: #f8f7f4; --text: #212321; --muted: #5f645f; --border: #d7dad5; --accent: #244e3c; --card: #eeeee9; }
    @media (prefers-color-scheme: dark) { :root { --bg:#151a17; --text:#f1f3ee; --muted:#b6c0b8; --border:#46504a; --accent:#a5d5b7; --card:#202923; } }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body { margin: 0; min-height: 100vh; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:16px; line-height:1.5; }
    .shell { max-width:1120px; margin:auto; padding:0 40px; }
    header { min-height:84px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); gap:20px; }
    .brand { color:var(--text); text-decoration:none; font-size:18px; font-weight:750; letter-spacing:-.04em; }
    .brand span { color:var(--accent); }
    .tag { font-size:14px; color:var(--muted); }
    main { min-height:calc(100vh - 166px); display:flex; align-items:center; padding:72px 0; }
    .hero { max-width:780px; }
    .eyebrow { display:flex; align-items:center; gap:10px; color:var(--accent); font-size:14px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; }
    .dot { width:8px; height:8px; background:var(--accent); border-radius:50%; }
    h1 { font-size:clamp(44px,7vw,82px); letter-spacing:-.065em; line-height:1.04; margin:24px 0; font-weight:750; }
    h1 span { color:var(--accent); }
    .lead { font-size:clamp(18px,2.1vw,22px); color:var(--muted); max-width:620px; margin:0; line-height:1.55; }
    .note { margin-top:48px; border-left:3px solid var(--accent); background:var(--card); padding:20px 24px; max-width:560px; border-radius:0 8px 8px 0; }
    .note strong { display:block; margin-bottom:4px; }
    .note p { margin:0; color:var(--muted); }
    footer { border-top:1px solid var(--border); min-height:82px; display:flex; align-items:center; justify-content:space-between; gap:16px; color:var(--muted); font-size:14px; }
    @media (max-width:600px) { .shell { padding:0 24px; } header { min-height:72px; } main { min-height:calc(100vh - 145px); padding:64px 0; } h1 { margin:20px 0; } .note { margin-top:36px; } footer { min-height:73px; flex-wrap:wrap; padding:16px 0; } }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <a class="brand" href="/" aria-label="Albion AI — главная">albion<span>ai</span>.lol</a>
      <span class="tag">Тестовая версия</span>
    </header>
    <main>
      <section class="hero" aria-labelledby="welcome">
        <div class="eyebrow"><span class="dot" aria-hidden="true"></span> Добро пожаловать</div>
        <h1 id="welcome">Здесь начинается <span>Albion AI.</span></h1>
        <p class="lead">Сайт запущен! Это первая тестовая страница. Скоро здесь появится что-то интересное.</p>
        <div class="note"><strong>Всё работает</strong><p>Если вы видите эту страницу по своему домену, значит сайт успешно опубликован.</p></div>
      </section>
    </main>
    <footer><span>© Albion AI</span><span>Первая страница проекта</span></footer>
  </div>
</body>
</html>
